# dsh-ssh-fleet bundle layer.
#
# The original local execution providers move into an isolated group, where
# they keep serving local Sessions through `ctx.sshFleetLocal`. The root
# `fs`, `subprocess` and `sandbox` become routers that send each call to the
# local machine or to the server the calling Session is bound to.

- id: fs-sandbox
  disabled: true

- id: subprocess
  disabled: true

- id: sandbox
  disabled: true

- insert:
    - id: ssh-fleet-local
      name: cordis:group
      group: true
      isolate:
        fs: true
        subprocess: true
        sandbox: true
      config:
        - id: ssh-fleet-local-subprocess
          name: '@deepseek-ai/dsh-subprocess-local'
        - id: ssh-fleet-local-sandbox
          name: '@deepseek-ai/dsh-sandbox-local'
        - id: ssh-fleet-local-fs
          name: '@deepseek-ai/dsh-fs-sandbox'
        - id: ssh-fleet-local-bridge
          name: 'dsh-ssh-fleet/local-bridge'

    # Servers can be listed here (config.hosts) or in
    # $DSH_HOME/ssh-fleet/hosts.json; see README.
    - id: ssh-fleet
      name: dsh-ssh-fleet
