# dsh-ssh-workspace bundle layer.
#
# The UI writes the `ssh-workspace` settings namespace. Environment-backed
# fields below remain as a headless/legacy base layer and never contain a
# plaintext password; passwordRef values resolve through DSH credentials.

- insert:
    - id: ssh-workspace-runtime
      name: 'dsh-ssh-workspace'
      config:
        anchorRoot: !!js process.env.DSH_SSH_ANCHOR_ROOT
        servers: !!js "process.env.DSH_SSH_SERVERS === undefined ? [] : JSON.parse(process.env.DSH_SSH_SERVERS)"
        host: !!js process.env.DSH_SSH_HOST
        port: !!js Number(process.env.DSH_SSH_PORT ?? 22)
        username: !!js process.env.DSH_SSH_USER
        root: !!js process.env.DSH_SSH_ROOT
        privateKeyPath: !!js process.env.DSH_SSH_PRIVATE_KEY
        passwordEnv: !!js "process.env.DSH_SSH_PASSWORD === undefined ? undefined : 'DSH_SSH_PASSWORD'"
        passphraseEnv: !!js "process.env.DSH_SSH_PASSPHRASE === undefined ? undefined : 'DSH_SSH_PASSPHRASE'"
        agent: !!js process.env.SSH_AUTH_SOCK
        hostKeySha256: !!js process.env.DSH_SSH_HOST_KEY_SHA256
        acceptUnknownHostKey: !!js process.env.DSH_SSH_ACCEPT_UNKNOWN_HOST_KEY === '1'
        workspaces: !!js JSON.parse(process.env.DSH_SSH_WORKSPACES ?? '[]')

    - id: ssh-workspace-registrar
      name: 'dsh-ssh-workspace/workspaces'

# Disable the original single-world providers by their guarded identity, then
# insert mixed local/SSH routers under new row ids. The routers inherit DSH's
# native local implementations and select SSH only for deterministic anchors.
# Cordis refuses an in-place name change.
- id: subprocess
  name: '@deepseek-ai/dsh-subprocess-local'
  disabled: true

- id: fs-sandbox
  name: '@deepseek-ai/dsh-fs-sandbox'
  disabled: true

# Replace the same-world sandbox provider with a mixed provider: ordinary host
# workspaces retain DSH's native runner, while SSH workspaces receive a remote
# bubblewrap profile whose writable root is translated out of the host anchor.
- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  disabled: true

- id: bash-sandbox
  name: '@deepseek-ai/dsh-bash-sandbox'
  disabled: false
  config:
    cwd: !!js process.env.DSH_SSH_ANCHOR_ROOT ?? process.cwd()
    timeoutMs: 60000

- insert:
    - id: sandbox-ssh
      name: 'dsh-ssh-workspace/sandbox'

    - id: subprocess-ssh
      name: 'dsh-ssh-workspace/subprocess'

    - id: fs-ssh
      name: 'dsh-ssh-workspace/fs'

    # DSH normally mounts exactly one platform shell under ctx.shell. Windows
    # local workspaces still need PowerShell while SSH workspaces need Bash, so
    # place the PowerShell executor and tool in their own shell realm. Its
    # subprocess realm contains a guarded native-local provider that refuses SSH
    # anchors. Hiding the root settings service from the isolated executor also
    # prevents Bash and pwsh from registering the same `shell` settings namespace.
    - id: subprocess-pwsh-local
      name: 'dsh-ssh-workspace/local-pwsh-subprocess'
      disabled: !!js process.platform !== 'win32'
      isolate:
        subprocess: dsh-ssh-local-pwsh

- id: pwsh-sandbox
  disabled: !!js process.platform !== 'win32'
  isolate:
    shell: dsh-ssh-local-pwsh
    subprocess: dsh-ssh-local-pwsh
    settings: dsh-ssh-local-pwsh

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: false

- id: tool-pwsh
  disabled: !!js process.platform !== 'win32'
  isolate:
    shell: dsh-ssh-local-pwsh

# The Web bundle contributes this guarded row. The mixed picker below retains
# its local browse implementation and adds an SSH-server root alongside it. It
# is absent in a base-only profile (which may log one harmless "entry not
# found" patch diagnostic).
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-auto'
  disabled: true

- insert:
    - id: directory-picker-ssh
      name: 'dsh-ssh-workspace/directory-picker'
      config:
        maxEntries: 1000

    # The adaptive DSH picker normally mounts its Host backend and matching
    # Client surface as a pair. Because this bundle replaces only the backend
    # with the mixed local/SSH implementation, mount the browse surface
    # explicitly so the Web UI can drive both directory worlds.
    - id: directory-picker-ssh-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
