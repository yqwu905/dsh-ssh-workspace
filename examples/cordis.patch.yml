# Copy this as a later profile patch when you prefer YAML configuration over
# DSH_SSH_* environment variables. Never put a password or key passphrase here.

- id: ssh-workspace-runtime
  name: 'dsh-ssh-workspace'
  config:
    host: ssh.example.com
    port: 22
    username: developer
    root: /srv/projects
    privateKeyPath: ~/.ssh/id_ed25519
    hostKeySha256: SHA256:REPLACE_WITH_VERIFIED_FINGERPRINT
    workspaces:
      - path: /srv/projects/api
        title: API server
      - path: /srv/projects/web
        title: Web client
